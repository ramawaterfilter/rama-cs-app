<div>
  <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <div class="breadcrumb"><span>Admin</span> / Filters</div>
      <h2>Dynamic Filter Management</h2>
      <p>Manage product capacity filters (e.g., 6L, 8L, 12L).</p>
    </div>
    <button class="btn btn-primary" (click)="openNew()">+ Add Filter</button>
  </div>

  <div class="card">
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Filter Name</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of filters">
            <td><span class="chip">#{{ f.id }}</span></td>
            <td><strong>{{ f.name }}</strong></td>
            <td>
              <span class="badge badge-success" *ngIf="f.is_active">Active</span>
              <span class="badge badge-secondary" *ngIf="!f.is_active">Inactive</span>
            </td>
            <td>
              <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-sm btn-outline" (click)="openEdit(f)">✏️ Edit</button>
                <button class="btn btn-sm btn-danger" (click)="delete(f.id)">🗑️</button>
              </div>
            </td>
          </tr>
          <tr *ngIf="filters.length === 0">
            <td colspan="4">
              <div class="empty-state">
                <div class="empty-icon">📏</div>
                <p>No filters yet.</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
    <div class="modal-box" style="max-width:440px;" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ editMode ? '✏️ Edit Filter' : '+ New Filter' }}</h3>
        <button class="modal-close" (click)="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-success" *ngIf="saveMsg && !saveMsg.includes('Error')">{{ saveMsg }}</div>
        <div class="alert alert-danger" *ngIf="saveMsg && saveMsg.includes('Error')">{{ saveMsg }}</div>

        <div class="form-group">
          <label class="form-label">Filter Name</label>
          <input type="text" class="form-control" [(ngModel)]="form.name" placeholder="e.g. 6 Liters">
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
          <input type="checkbox" [(ngModel)]="form.is_active" id="isActive">
          <label for="isActive" class="form-label" style="margin:0; cursor:pointer;">Active</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="save()" [disabled]="saving || !form.name">
          {{ saving ? 'Saving...' : '💾 Save' }}
        </button>
      </div>
    </div>
  </div>
</div>
