<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="page-title">Customer Outreach Options</h2>
        <p class="text-muted">Manage the outreach types available in the enquiry form.</p>
      </div>
      <button class="btn btn-primary" (click)="openNew()">+ Add Outreach Type</button>
    </div>
  
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="bg-light">
              <tr>
                <th style="width: 80px">No.</th>
                <th>Name</th>
                <th>Status</th>
                <th class="text-end" style="width: 150px">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of list | slice: (currentPage - 1) * pageSize : currentPage * pageSize; let i = index">
                <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
                <td><strong>{{ item.name }}</strong></td>
                <td>
                  <span class="badge" [class.bg-success]="item.is_active" [class.bg-secondary]="!item.is_active">
                    {{ item.is_active ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-2" (click)="openEdit(item)">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" (click)="delete(item.id)">Delete</button>
                </td>
              </tr>
              <tr *ngIf="list.length === 0">
                <td colspan="4" class="text-center py-4">No outreach options found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modal -->
  <div class="modal-backdrop" *ngIf="showModal" (click)="closeModal()"></div>
  <div class="modal" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title">{{ editMode ? 'Edit' : 'Add' }} Outreach Type</h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="form-group mb-3">
            <label class="form-label">Outreach Name</label>
            <input type="text" class="form-control" [(ngModel)]="form.name" placeholder="e.g. Existing Customer">
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" [(ngModel)]="form.is_active" id="activeSwitch">
            <label class="form-check-label" for="activeSwitch">Active</label>
          </div>
          <div *ngIf="saveMsg" class="alert py-2" [class.alert-success]="!saveMsg.includes('Error')" [class.alert-danger]="saveMsg.includes('Error')">
            {{ saveMsg }}
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" (click)="closeModal()">Cancel</button>
          <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving || !form.name">
            {{ saving ? 'Saving...' : 'Save Outreach' }}
          </button>
        </div>
      </div>
    </div>
  </div>
